name: Setup
description: >
  Check out the core repo at a given ref next to this repo (the SDK is linked from
  ../transcoda/packages/sdk until it is published), then install both workspaces.

inputs:
  core-ref:
    description: Git ref of transcoda/transcoda to build the plugins against.
    required: true
  core-token:
    description: Token with read access to the (private) core repo.
    required: true

runs:
  using: composite
  steps:
    # actions/checkout only writes inside the workspace, so check out into .core/ and
    # symlink it to the sibling path the `link:` dependency expects.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: transcoda/transcoda
        ref: ${{ inputs.core-ref }}
        token: ${{ inputs.core-token }}
        path: .core/transcoda
        persist-credentials: false
    - shell: bash
      run: ln -sfn "$GITHUB_WORKSPACE/.core/transcoda" "$GITHUB_WORKSPACE/../transcoda"
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          .core/transcoda/pnpm-lock.yaml
    - shell: bash
      run: pnpm --dir ../transcoda install --frozen-lockfile
    - shell: bash
      run: pnpm install --frozen-lockfile
