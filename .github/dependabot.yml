version: 2
updates:
  # Keeps the SHA-pinned actions current; Dependabot rewrites the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)

  # Repository and plugin dev dependencies (plugins ship no runtime dependencies).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Types follow the Node major that CI and the image run (24); bump by hand with Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    versioning-strategy: increase
    commit-message:
      prefix: chore(deps)
