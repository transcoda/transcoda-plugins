name: Release note

# A pull request adds a valid .changes/<plugin>/<short-name>.md (or .changes/<plugin>-<short-name>.md),
# or carries the "no user-facing change" label; Renovate's pull requests need neither. The rules
# live in transcoda/.github (@transcoda/dev-config/changes); `pnpm check-plugins` runs the same
# lint locally.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  release-note:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: transcoda/.github/actions/release-note@690ae52154e1b41a4cbd3b33069f1e590daa011d # v1.1.1
        with:
          layout: per-folder
          folders: plugins
          skip-authors: renovate[bot]
