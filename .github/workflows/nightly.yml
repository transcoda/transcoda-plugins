name: Nightly

# Every check CI runs, every night, against core's main: when this repo's main or core's main moved
# since the last nightly. CI runs on pushes here, so a core change that breaks a plugin (its SDK,
# its plugin host) would otherwise show only on the next plugin pull request.
# A failing test gets a GitHub issue labelled `nightly`, and a failing step that is not a test
# (typecheck, lint, bundle, host check) one "the run failed outside its tests" issue; an issue
# whose test passes again is closed. The issues come from core's scripts/nightly-issues.ts.
# Run it by hand from the Actions tab: that always runs.

on:
  schedule:
    # 07:47 UTC, half an hour after core's nightly (02:47 in New York).
    - cron: '47 7 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=main&status=completed&per_page=1" \
            --jq '.workflow_runs[0] // {} | [.head_sha // "", .run_started_at // ""] | @tsv')
          sha=$(printf '%s' "$last" | cut -f1)
          since=$(printf '%s' "$last" | cut -f2)
          if [ "$sha" != "$GITHUB_SHA" ] || [ -z "$since" ]; then
            echo "main moved since the last nightly"
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          core=$(gh api "repos/transcoda/transcoda/commits?sha=main&since=$since&per_page=1" --jq length)
          if [ "$core" -gt 0 ]; then
            echo "core's main moved since the last nightly ($since)"
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo "neither main moved since the last nightly ($since): nothing to test"
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          core-ref: main
      - name: Core commit
        run: echo "Tested against transcoda/transcoda@$(git -C ../transcoda rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      # The steps of `pnpm check`, each run even when one before it failed, so one night reports
      # every failure.
      - run: pnpm typecheck
      - if: ${{ !cancelled() }}
        run: pnpm lint
      - if: ${{ !cancelled() }}
        run: pnpm check-plugins
      - if: ${{ !cancelled() }}
        run: pnpm check-blocklist
      - if: ${{ !cancelled() }}
        run: pnpm test --reporter=default --reporter=json --outputFile.json=.nightly/vitest.json
      - id: bundle
        if: ${{ !cancelled() }}
        run: pnpm bundle
      # No node:fs, child_process, eval, global fetch ... in any built bundle.
      - if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: node scripts/check-bundles.mjs
      # Starts every bundle in core's real sandboxed host and checks its sdk range.
      - if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: node scripts/host-check.mjs
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-vitest
          path: .nightly/vitest.json
          retention-days: 14
          if-no-files-found: ignore

  issues:
    needs: [changed, check]
    if: ${{ !cancelled() && needs.changed.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Only the issue script, from core's main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: transcoda/transcoda
          ref: main
          path: core
          sparse-checkout: |
            scripts/nightly-issues.ts
            .node-version
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: core/.node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-vitest
          path: .nightly
        continue-on-error: true
      - name: Open, update and close the nightly issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          RUN_FAILED: ${{ needs.check.result != 'success' }}
          # The check job's checkout: vitest's paths are made relative to it.
          TEST_ROOT: ${{ github.workspace }}
        run: node core/scripts/nightly-issues.ts .nightly/vitest.json
