name: Nightly

# Every check CI runs, every night, against core's main: when this repo's main or core's main moved
# since the last nightly. CI runs on pushes here, so a core change that breaks a plugin (its SDK,
# its plugin host) would otherwise show only on the next plugin pull request.
# A failing test gets a GitHub issue labelled `nightly`, and a failing step that is not a test
# (typecheck, lint, bundle, host check) one "the run failed outside its tests" issue; an issue
# whose test passes again is closed. Deciding whether to run and filing the issues are the
# nightly-changed and nightly-issues actions from transcoda/.github.
# Run it by hand from the Actions tab: that always runs.

on:
  schedule:
    # 07:47 UTC, half an hour after core's nightly (02:47 in New York).
    - cron: '47 7 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      # 'true' when this repo's main moved since the last completed nightly, when core's main got a
      # commit since that run started, when there is no earlier run, or for a run by hand.
      - id: changed
        uses: transcoda/.github/actions/nightly-changed@43cbb990910eca37108711aedaa1b939835a1941 # v1.1.0
        with:
          also-watch: transcoda/transcoda

  check:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      step-failed: ${{ steps.outcome.outputs.step-failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          core-ref: main
      - name: Core commit
        run: echo "Tested against transcoda/transcoda@$(git -C ../transcoda rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      # The steps of `pnpm check`, each run even when one before it failed, so one night reports
      # every failure.
      - id: typecheck
        run: pnpm typecheck
      - id: lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - id: check-plugins
        if: ${{ !cancelled() }}
        run: pnpm check-plugins
      - id: check-blocklist
        if: ${{ !cancelled() }}
        run: pnpm check-blocklist
      - id: check-file-size
        if: ${{ !cancelled() }}
        run: pnpm check-file-size
      - if: ${{ !cancelled() }}
        run: pnpm test --reporter=default --reporter=json --outputFile.json=.nightly/vitest.json
      - id: bundle
        if: ${{ !cancelled() }}
        run: pnpm bundle
      # No node:fs, child_process, eval, global fetch ... in any built bundle.
      - id: check-bundles
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: node scripts/check-bundles.mjs
      # Starts every bundle in core's real sandboxed host and checks its sdk range.
      - id: host-check
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: node scripts/host-check.mjs
      # A step that is not a test failed: the run issue, even when tests fail too.
      - id: outcome
        if: ${{ !cancelled() }}
        env:
          FAILED: >-
            ${{ steps.typecheck.outcome == 'failure' || steps.lint.outcome == 'failure'
            || steps.check-plugins.outcome == 'failure' || steps.check-blocklist.outcome == 'failure'
            || steps.check-file-size.outcome == 'failure'
            || steps.bundle.outcome == 'failure' || steps.check-bundles.outcome == 'failure'
            || steps.host-check.outcome == 'failure' }}
        run: echo "step-failed=$FAILED" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-vitest
          path: .nightly/vitest.json
          retention-days: 14
          if-no-files-found: ignore

  issues:
    needs: [changed, check]
    if: ${{ !cancelled() && needs.changed.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-vitest
          path: .nightly
        # No report when the check job failed before the tests: the action counts the missing file
        # as a run that failed.
        continue-on-error: true
      - uses: transcoda/.github/actions/nightly-issues@43cbb990910eca37108711aedaa1b939835a1941 # v1.1.0
        with:
          reports: .nightly/vitest.json
          run-failed: ${{ needs.check.result != 'success' }}
          step-failed: ${{ needs.check.outputs.step-failed == 'true' }}
          # test-root stays at its default, the workspace: the check job's checkout sits at the
          # same path, so vitest's paths are made relative to it.
