name: Release

# One release per plugin: push a tag <plugin>-v<semver>, e.g. example-v0.1.0.
# GitHub starts no workflow for a push of more than three tags at once; for those, run this by
# hand from main with the tag's name (the tag must already exist; the run builds the tagged commit).
on:
  push:
    tags:
      - '*-v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag, <plugin>-v<semver>
        required: true
        type: string

concurrency:
  # The tag name, so a push run and a run by hand for the same tag queue behind each other.
  group: release-${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

env:
  # Core version the released bundle is built and tested against (newest supported).
  CORE_REF: main

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds PLUGIN_SIGNING_KEY / PLUGIN_SIGNING_KEY_ID as environment secrets (see docs/maintaining.md).
    environment: plugin-signing
    permissions:
      contents: write
      # Build provenance attestation for the bundle (actions/attest-build-provenance).
      id-token: write
      attestations: write
    outputs:
      plugin: ${{ steps.tag.outputs.plugin }}
      notes: ${{ steps.notes.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A run by hand builds the tag, never the branch it was started from.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Parse tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^([a-z][a-z0-9-]*)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::tag '$TAG' is not <plugin>-v<semver>"; exit 1
          fi
          plugin="${BASH_REMATCH[1]}" version="${BASH_REMATCH[2]}"
          manifest="plugins/$plugin/package.json"
          if [[ ! -f "$manifest" ]]; then echo "::error::no plugin at plugins/$plugin"; exit 1; fi
          actual=$(node -p "require('./$manifest').version")
          if [[ "$actual" != "$version" ]]; then
            echo "::error::tag version $version does not match $manifest version $actual"; exit 1
          fi
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: List the release notes this release publishes
        id: notes
        env:
          PLUGIN: ${{ steps.tag.outputs.plugin }}
        run: |
          # The same files scripts/release-notes.mjs reads: .changes/<plugin>/*.md and the flat
          # .changes/<plugin>-*.md, as they are at the tag.
          shopt -s nullglob
          files=(".changes/$PLUGIN"/*.md ".changes/$PLUGIN"-*.md)
          echo "files=${files[*]}" >> "$GITHUB_OUTPUT"
          echo "notes: ${files[*]:-(none)}"
      - uses: ./.github/actions/setup
        with:
          core-ref: ${{ env.CORE_REF }}
      - run: pnpm check
      - run: pnpm --filter "./plugins/${{ steps.tag.outputs.plugin }}" bundle
      - name: Verify checksum
        working-directory: plugins/${{ steps.tag.outputs.plugin }}/dist
        run: sha256sum --check *.js.sha256
      - name: Sign bundle
        id: sign
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          PLUGIN_SIGNING_KEY_ID: ${{ secrets.PLUGIN_SIGNING_KEY_ID }}
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          node scripts/sign.mjs sign "plugins/$PLUGIN/dist/$PLUGIN-$VERSION.js" --key-id "$PLUGIN_SIGNING_KEY_ID"
          public=$(node --input-type=module -e "import { publicKeyHex } from './scripts/sign.mjs'; console.log(publicKeyHex(process.env.PLUGIN_SIGNING_KEY))")
          echo "public=$public" >> "$GITHUB_OUTPUT"
      - name: Verify signature
        env:
          PUBLIC_KEY: ${{ steps.sign.outputs.public }}
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: node scripts/sign.mjs verify "plugins/$PLUGIN/dist/$PLUGIN-$VERSION.js" --public "$PUBLIC_KEY"
      - name: Check the bundle in core's host
        run: node scripts/host-check.mjs
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: plugins/${{ steps.tag.outputs.plugin }}/dist/${{ steps.tag.outputs.plugin }}-${{ steps.tag.outputs.version }}.js
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          BY_HAND: ${{ inputs.tag != '' && github.sha || '' }}
        run: |
          dist="plugins/$PLUGIN/dist"
          # The attestation's Sigstore bundle (one JSON line: the signed SLSA provenance for the
          # bundle), attached as <name>-<version>.intoto.jsonl so it can be verified offline.
          cp "$ATTESTATION_BUNDLE" "$dist/$PLUGIN-$VERSION.intoto.jsonl"
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          # Body: the core version, the attestation line the catalog reads, then the release notes
          # from .changes/<plugin>/ (the remove-notes job then opens a pull request deleting them).
          {
            echo "Built against core \`$CORE_REF\`."
            echo
            echo "Attestation: $ATTESTATION_URL"
            if [[ -n "$BY_HAND" ]]; then
              echo
              echo "Released by a run started by hand from \`main\` (\`${BY_HAND:0:7}\`), so the attestation names \`main\` as its source; the bundle is built from the tag \`$TAG\`."
            fi
            notes=$(node scripts/release-notes.mjs "$PLUGIN")
            if [[ -n "$notes" ]]; then echo; echo "$notes"; fi
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" "$dist/$PLUGIN-$VERSION.js" "$dist/$PLUGIN-$VERSION.js.sha256" \
            "$dist/$PLUGIN-$VERSION.js.sig" "$dist/$PLUGIN-$VERSION.manifest.json" \
            "$dist/$PLUGIN-$VERSION.intoto.jsonl" \
            --title "$PLUGIN $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag "${prerelease[@]}"

  # Opens a pull request that deletes the notes the release just published, so the next release of
  # the plugin does not publish them again. Runs outside the plugin-signing environment, and never
  # fails the run: the catalog workflow publishes only after a successful Release run.
  remove-notes:
    needs: release
    if: ${{ needs.release.outputs.notes != '' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Open a pull request removing the published notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PLUGIN: ${{ needs.release.outputs.plugin }}
          NOTES: ${{ needs.release.outputs.notes }}
        run: |
          # Only the notes the tag held: a note merged to main after the tag belongs to the next release.
          read -ra notes <<< "$NOTES"
          gone=()
          for f in "${notes[@]}"; do [[ -f "$f" ]] && gone+=("$f"); done
          if [[ ${#gone[@]} -eq 0 ]]; then echo "the notes are already gone from main"; exit 0; fi
          branch="release-notes/$TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git rm -q -- "${gone[@]}"
          git commit -q -m "Release notes: remove the notes $TAG published"
          git push -q origin "$branch"
          body="The $TAG release published these notes; removing them keeps the next $PLUGIN release from publishing them again."
          if ! gh pr create --base main --head "$branch" --label 'no user-facing change' \
              --title "Release notes: remove the notes $TAG published" --body "$body"; then
            echo "::warning::could not open the pull request (does the repository let GitHub Actions create pull requests?); open it from branch $branch"
          fi
