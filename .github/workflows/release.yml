name: Release

# One release per plugin: push a tag <plugin>-v<semver>, e.g. example-v0.1.0.
on:
  push:
    tags:
      - '*-v[0-9]*'

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

env:
  # Core version the released bundle is built and tested against (newest supported).
  CORE_REF: main

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds PLUGIN_SIGNING_KEY / PLUGIN_SIGNING_KEY_ID as environment secrets (see README).
    environment: plugin-signing
    permissions:
      contents: write
      # Build provenance attestation for the bundle (actions/attest-build-provenance).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^([a-z][a-z0-9-]*)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::tag '$TAG' is not <plugin>-v<semver>"; exit 1
          fi
          plugin="${BASH_REMATCH[1]}" version="${BASH_REMATCH[2]}"
          manifest="plugins/$plugin/package.json"
          if [[ ! -f "$manifest" ]]; then echo "::error::no plugin at plugins/$plugin"; exit 1; fi
          actual=$(node -p "require('./$manifest').version")
          if [[ "$actual" != "$version" ]]; then
            echo "::error::tag version $version does not match $manifest version $actual"; exit 1
          fi
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        with:
          core-ref: ${{ env.CORE_REF }}
          core-token: ${{ secrets.CORE_REPO_TOKEN }}
      - run: pnpm check
      - run: pnpm --filter "./plugins/${{ steps.tag.outputs.plugin }}" bundle
      - name: Verify checksum
        working-directory: plugins/${{ steps.tag.outputs.plugin }}/dist
        run: sha256sum --check *.js.sha256
      - name: Sign bundle
        id: sign
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          PLUGIN_SIGNING_KEY_ID: ${{ secrets.PLUGIN_SIGNING_KEY_ID }}
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          node scripts/sign.mjs sign "plugins/$PLUGIN/dist/$PLUGIN-$VERSION.js" --key-id "$PLUGIN_SIGNING_KEY_ID"
          public=$(node --input-type=module -e "import { publicKeyHex } from './scripts/sign.mjs'; console.log(publicKeyHex(process.env.PLUGIN_SIGNING_KEY))")
          echo "public=$public" >> "$GITHUB_OUTPUT"
      - name: Verify signature
        env:
          PUBLIC_KEY: ${{ steps.sign.outputs.public }}
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: node scripts/sign.mjs verify "plugins/$PLUGIN/dist/$PLUGIN-$VERSION.js" --public "$PUBLIC_KEY"
      - name: Check the bundle in core's host
        run: node scripts/host-check.mjs
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: plugins/${{ steps.tag.outputs.plugin }}/dist/${{ steps.tag.outputs.plugin }}-${{ steps.tag.outputs.version }}.js
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          dist="plugins/$PLUGIN/dist"
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          # Body: the core version, the attestation line the catalog reads, then the release notes
          # from .changes/<plugin>/ (consumed notes are removed by hand after the release).
          {
            echo "Built against core \`$CORE_REF\`."
            echo
            echo "Attestation: $ATTESTATION_URL"
            notes=$(node scripts/release-notes.mjs "$PLUGIN")
            if [[ -n "$notes" ]]; then echo; echo "$notes"; fi
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" "$dist/$PLUGIN-$VERSION.js" "$dist/$PLUGIN-$VERSION.js.sha256" \
            "$dist/$PLUGIN-$VERSION.js.sig" "$dist/$PLUGIN-$VERSION.manifest.json" \
            --title "$PLUGIN $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag "${prerelease[@]}"
